<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hockey Scoreboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Arial Black', Impact, sans-serif;
      user-select: none;
    }

    body {
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .scoreboard-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 460px;
    }

    /* 1. Trapezoid Timer */
    .timer-trap {
      width: 130px;
      height: 60px;
      background: linear-gradient(180deg, #5bd3dd 0%, #1f778a 100%);
      clip-path: polygon(18% 0%, 82% 0%, 100% 100%, 0% 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: -5px;
      z-index: 2;
    }

    .timer-trap span {
      font-size: 18px;
      line-height: 1.1;
      color: #0b323a;
      font-weight: 900;
    }

    /* 2. Main Bar */
    .main-bar {
      display: flex;
      align-items: center;
      width: 100%;
      height: 75px;
      position: relative;
    }

    .team-ind {
      flex: 1.2;
      height: 100%;
      background: linear-gradient(90deg, #182470 0%, #175bb8 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .team-ind span {
      font-size: 44px;
      color: #8ed6ff;
      -webkit-text-stroke: 2px #000;
      letter-spacing: 2px;
    }

    .score-center {
      width: 140px;
      height: 80px;
      background: radial-gradient(circle, #522c15 0%, #200f05 100%);
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-size: 46px;
      font-weight: 900;
      -webkit-text-stroke: 2px #000;
      z-index: 3;
      margin-left: -6px;
      margin-right: -6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      gap: 3px;
    }

    .team-jap {
      flex: 1.2;
      height: 100%;
      background: #9f5bb0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .team-jap span {
      font-size: 44px;
      color: #e50914;
      -webkit-text-stroke: 2px #000;
      letter-spacing: 2px;
    }

    /* 3. Button Controls */
    .control-box {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 30px;
      width: 100%;
      background: #141414;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #2a2a2a;
    }

    .grp {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .grp p {
      color: #888;
      font-size: 11px;
      text-align: center;
      font-family: sans-serif;
      font-weight: bold;
    }

    .grp button {
      padding: 10px 0;
      font-weight: bold;
      font-size: 13px;
      border: none;
      border-radius: 6px;
      background: #2b2b2b;
      color: #fff;
      cursor: pointer;
      touch-action: manipulation;
    }

    .grp button:active {
      background: #555;
      transform: scale(0.95);
    }

    .btn-blue {
      background: #00768c !important;
    }
  </style>
</head>
<body>

  <div class="scoreboard-wrap">
    
    <!-- Timer -->
    <div class="timer-trap">
      <span id="t-min">23</span>
      <span style="font-size: 13px; margin: -3px 0;">:</span>
      <span id="t-sec">00</span>
    </div>

    <!-- Main Bar -->
    <div class="main-bar">
      <div class="team-ind"><span>IND</span></div>
      <div class="score-center">
        <span id="ind-score">0</span>
        <span>-</span>
        <span id="jap-score">0</span>
      </div>
      <div class="team-jap"><span>JAP</span></div>
    </div>

    <!-- Controls -->
    <div class="control-box">
      <div class="grp">
        <p>IND GOAL</p>
        <button type="button" onclick="window.addGoal('ind', 1)">+1 Goal</button>
        <button type="button" onclick="window.addGoal('ind', -1)">-1</button>
      </div>

      <div class="grp">
        <p>TIMER</p>
        <button type="button" class="btn-blue" onclick="window.startT()">Start</button>
        <button type="button" class="btn-blue" onclick="window.pauseT()">Pause</button>
        <button type="button" class="btn-blue" onclick="window.resetT()">Reset</button>
      </div>

      <div class="grp">
        <p>JAP GOAL</p>
        <button type="button" onclick="window.addGoal('jap', 1)">+1 Goal</button>
        <button type="button" onclick="window.addGoal('jap', -1)">-1</button>
      </div>
    </div>

  </div>

  <script>
    var indGoals = 0;
    var japGoals = 0;
    var totalSec = 23 * 60;
    var timerRunning = null;

    // Direct window functions (Mobile Touch Support)
    window.addGoal = function(team, val) {
      if (team === 'ind') {
        indGoals = Math.max(0, indGoals + val);
        document.getElementById("ind-score").innerText = indGoals;
      } else if (team === 'jap') {
        japGoals = Math.max(0, japGoals + val);
        document.getElementById("jap-score").innerText = japGoals;
      }
    };

    window.updateTimerView = function() {
      var m = Math.floor(totalSec / 60);
      var s = totalSec % 60;
      document.getElementById("t-min").innerText = (m < 10 ? "0" : "") + m;
      document.getElementById("t-sec").innerText = (s < 10 ? "0" : "") + s;
    };

    window.startT = function() {
      if (timerRunning) return;
      timerRunning = setInterval(function() {
        if (totalSec > 0) {
          totalSec--;
          window.updateTimerView();
        } else {
          clearInterval(timerRunning);
          timerRunning = null;
          alert("Time Finished!");
        }
      }, 1000);
    };

    window.pauseT = function() {
      clearInterval(timerRunning);
      timerRunning = null;
    };

    window.resetT = function() {
      window.pauseT();
      totalSec = 23 * 60;
      window.updateTimerView();
    };

    window.updateTimerView();
  </script>
</body>
</html>
